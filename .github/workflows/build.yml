name: Build extractor jars
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build jars
        run: |
          chmod +x gradlew
          ./gradlew :extractor:jar :timeago-parser:jar --no-daemon
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: newpipe-extractor-jars
          path: |
            extractor/build/libs/*.jar
            timeago-parser/build/libs/*.jar